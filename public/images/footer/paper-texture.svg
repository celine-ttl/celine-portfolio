<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="paperNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" stitchTiles="stitch" result="noise" />
    <feColorMatrix in="noise" type="matrix"
      values="0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0.33 0.33 0.33 0 0
              0 0 0 1 0" result="gray" />
    <feComponentTransfer in="gray">
      <feFuncR type="linear" slope="0.4" intercept="0.72" />
      <feFuncG type="linear" slope="0.4" intercept="0.72" />
      <feFuncB type="linear" slope="0.4" intercept="0.72" />
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#paperNoise)" />
</svg>
