<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celine’s portfolio (keyboard prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&family=DM+Sans:wght@400;500;700&family=Lobster&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #ffd7e9;
    --ink: #41549a;
    --muted: #6b7bb5;
    --case: #ffffff;
    --case-edge: #ecc6da;
    --bezel: #ffd7e9;
    --bezel-hi: #fff2f8;
    --screen: #2a3670;
    --screen-hi: #41549a;
    --text: #fff4f9;
    --text-dim: #d6c5ec;
    --face: #ffd7e9;
    --face-ink: #2a3670;
    --blush: #f58fbd;
    --tile-a: #ffd7e9;
    --tile-b: #ffffff;
    --tile-c: #8d9bd6;
    --tile-d: #f58fbd;
    --lcd: #1c2350;
    --lcd-ink: #ffd7e9;
    --blue: #41549a; --blue-d: #2a3670;
    --red: #7487d0; --red-d: #46589f;
    --yellow: #ffd7e9; --yellow-d: #e49bc2;
    --green: #c9d1f2; --green-d: #8d9bd6;
    --white: #ffffff; --white-d: #bcc4e6;
    --key-ink: #ffffff;
    --key-ink-dark: #41549a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a38;
      --bg2: #3a2350;
      --ink: #e8eeff;
      --muted: #9aa8d4;
      --case: #f3e3ec;
      --case-edge: #c79bb5;
      --bezel: #cf98b8;
      --bezel-hi: #f0c4da;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a38;
    --bg2: #3a2350;
    --ink: #e8eeff;
    --muted: #9aa8d4;
    --case: #f3e3ec;
    --case-edge: #c79bb5;
    --bezel: #cf98b8;
    --bezel-hi: #f0c4da;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, var(--bg2), transparent 55%),
      radial-gradient(circle, rgba(120,140,200,.22) 1.2px, transparent 1.4px);
    background-size: auto, 22px 22px;
    color: var(--ink);
    font-family: "Silkscreen", "Courier New", monospace;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  .wrap { width: 100%; max-width: 1000px; }

  /* ---------- CRT ---------- */
  .tv {
    background: linear-gradient(160deg, var(--bezel-hi), var(--bezel) 40%);
    border-radius: 34px;
    padding: 18px;
    box-shadow: 0 10px 0 #e49bc2, 0 22px 40px rgba(65,84,154,.28), inset 0 2px 0 rgba(255,255,255,.8);
  }
  .glass {
    position: relative;
    border-radius: 26px / 30px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, var(--screen-hi), var(--screen) 70%);
    color: var(--text);
    min-height: 380px;
    box-shadow: inset 0 0 60px rgba(0,0,0,.55), inset 0 0 0 3px rgba(0,0,0,.35);
  }
  .glass::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.12), transparent 45%);
    mix-blend-mode: multiply;
  }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 22px 0;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .08em;
  }
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    gap: 14px;
    padding: 10px 24px 26px;
    align-items: start;
  }
  .char { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face { width: 150px; height: auto; display: block; }
  .face g { display: none; }
  .face[data-s="idle"][data-b="0"] .eyes-o,
  .face[data-s="idle"][data-b="1"] .eyes-b,
  .face[data-s="think"] .eyes-t,
  .face[data-s="talk"] .eyes-o { display: inline; }
  .face[data-s="idle"] .m-idle,
  .face[data-s="think"] .m-think { display: inline; }
  .face[data-s="talk"][data-m="a"] .m-a { display: inline; }
  .face[data-s="talk"][data-m="b"] .m-b { display: inline; }
  .face[data-s="think"] .dots { display: inline; }
  .face .dots rect { animation: dot 1.1s steps(1) infinite; }
  .face .dots rect:nth-child(2) { animation-delay: .25s; }
  .face .dots rect:nth-child(3) { animation-delay: .5s; }
  @keyframes dot { 0%,100% { opacity: .2; } 40% { opacity: 1; } }
  .face g[fill="#41549a"] { fill: #3b2220; }
  .face g.dots { fill: #ffd7e9; }
  .face g.steam { fill: #c9d1f2; }
  .cB { fill: #5b2e2a; }
  .cF { fill: #a87355; }
  .cC { fill: #c0696f; }
  .cD { fill: #6a3530; }
  .cM { fill: #d9ae94; }
  .cS { fill: #6a3530; }
  .cR { fill: #c9d1f2; }
  .cY { fill: #ffb3d4; }
  .arm { animation: wave 1.2s steps(1) infinite; }
  .face[data-s="talk"] .arm { animation-duration: .45s; }
  @keyframes wave { 50% { transform: translate(1px, -1px); } }
  .steam { animation: steam 2.2s steps(1) infinite; }
  @keyframes steam { 50% { transform: translate(0, -1px); } }

  .content { min-width: 0; width: 100%; max-width: 560px; text-align: center; font-family: "VT323", "Courier New", monospace; font-size: clamp(19px, 2.3vw, 24px); line-height: 1.25; }
  .bubble {
    white-space: pre-line;
    position: relative;
    padding: 2px 0;
    min-height: 3.4em;
    margin-bottom: 16px;
  }
  .bubble::before {
    content: none;
  }
  .caret { display: inline-block; width: .5em; height: 1em; background: var(--text); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    background: rgba(8, 20, 40, .5);
    border: 2px solid var(--text-dim);
    border-radius: 6px;
    transition: transform .12s, background .12s, border-color .12s;
  }
  .tile:hover, .tile:focus-visible { background: rgba(255,255,255,.12); border-color: var(--face); transform: translate(-2px,-2px); box-shadow: 4px 4px 0 rgba(0,0,0,.35); }
  .tile:focus-visible { outline: 2px solid var(--face); outline-offset: 3px; }
  .tile .thumb { width: 44px; height: 44px; border-radius: 4px; image-rendering: pixelated; }
  .tile b { display: block; font-weight: 400; color: #fff; }
  .tile small { font-size: .8em; color: var(--text-dim); }
  .qs { display: grid; gap: 8px; max-width: 440px; margin: 0 auto; }
  .q { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1.2em 1fr; gap: 8px; padding: 8px 12px; border: 2px solid var(--text-dim); border-radius: 6px; background: rgba(20,24,60,.35); color: var(--text); transition: transform .12s, background .12s, border-color .12s; }
  .q::before { content: "↳"; color: var(--face); }
  .q:hover, .q:focus-visible { background: rgba(255,255,255,.12); border-color: var(--face); transform: translate(-2px,-2px); box-shadow: 4px 4px 0 rgba(0,0,0,.3); }
  .q:focus-visible { outline: 2px solid var(--face); outline-offset: 3px; }
  #view { transition: opacity .35s; }
  .typed { margin-top: 14px; min-height: 1.4em; color: var(--text); word-break: break-word; }
  .typed::before { content: "› "; color: var(--face); }
  .typed .ph { color: var(--text-dim); }
  .reset { all: unset; cursor: pointer; display: none; margin-right: 14px; color: var(--face); }
  .reset:hover, .reset:focus-visible { text-decoration: underline; }
  .reset:focus-visible { outline: 2px solid var(--face); outline-offset: 3px; }
  .thread { display: none; text-align: left; flex-direction: column; gap: 10px; max-height: 210px; overflow-y: auto; padding: 2px 6px 2px 2px; scrollbar-width: thin; }
  .msg { max-width: 84%; padding: 5px 12px; border-radius: 14px; word-break: break-word; }
  .msg.me { align-self: flex-end; background: #ffd7e9; color: #2a3670; border-bottom-right-radius: 4px; }
  .msg.bear { align-self: flex-start; color: var(--text); padding-left: 2px; }
  .msg .panel p { margin: 0 0 6px; }
  .panel a { color: var(--face); text-decoration: underline; text-underline-offset: 3px; }
  .panel a:hover, .panel a:focus-visible { color: #fff; }
  .glass.chat .bubble, .glass.chat #view { display: none; }
  .glass.chat .thread { display: flex; }
  .glass.chat .reset { display: inline; }
  .glass.chat .face { width: 84px; }
  .glass.chat .stage { gap: 10px; }
  .dash { display: inline-block; width: .7em; height: 3px; background: var(--face); margin: 0 2px; vertical-align: baseline; animation: blink 1s steps(1) infinite; }
  .detail h3 { margin: 0 0 6px; font-weight: 400; font-size: 1.25em; color: #fff; }
  .detail p { margin: 0 0 10px; max-width: 52ch; }
  .back {
    all: unset; cursor: pointer; padding: 4px 10px; border: 2px solid var(--text-dim); border-radius: 4px; color: var(--text);
  }
  .back:hover, .back:focus-visible { background: rgba(255,255,255,.14); outline: 2px solid var(--face); outline-offset: 2px; }
  .panel p { margin: 0 0 8px; max-width: 54ch; }

  /* ---------- Keyboard ---------- */
  .kb-wrap { margin-top: 22px; container-type: inline-size; }
  .kb {
    background: linear-gradient(180deg, var(--case), color-mix(in srgb, var(--case) 88%, #000));
    border-radius: 3.2cqw;
    padding: 2.2cqw 2.4cqw 2.6cqw;
    box-shadow: 0 .9cqw 0 var(--case-edge), 0 2.4cqw 3cqw rgba(20,30,70,.25), inset 0 .3cqw 0 rgba(255,255,255,.7);
  }
  .strip { display: grid; grid-template-columns: 1fr 1.1fr .6fr; gap: 1.6cqw; margin-bottom: 1.8cqw; align-items: stretch; }
  .coins {
    background: var(--yellow); border-radius: 1cqw; padding: .9cqw 1.6cqw;
    box-shadow: inset 0 -.4cqw 0 var(--yellow-d);
    display: flex; align-items: center; justify-content: space-between; gap: 1cqw;
    font-size: 1.55cqw; color: var(--key-ink-dark);
  }
  .coins output { font-size: 3.2cqw; letter-spacing: .15em; font-weight: 700; }
  .lcd {
    background: var(--lcd); border-radius: 1cqw; padding: 1cqw 1.8cqw;
    color: var(--lcd-ink); font-size: 2.2cqw; letter-spacing: .12em;
    white-space: nowrap; overflow: hidden; display: flex; align-items: center;
    box-shadow: inset 0 0 0 .3cqw #41549a;
  }
  .lcd .ph { opacity: .55; }
  .lcd .cur { display: inline-block; width: .25em; height: 1.1em; background: var(--lcd-ink); margin-left: .15em; animation: blink 1s steps(1) infinite; }
  .mode {
    background: var(--red); border-radius: 1cqw; padding: .9cqw 1.6cqw;
    box-shadow: inset 0 -.4cqw 0 var(--red-d);
    color: #fff; font-size: 2.2cqw; display: flex; align-items: center; justify-content: space-between;
  }
  .mode i { display: inline-block; width: .8cqw; height: .8cqw; border-radius: 50%; background: rgba(0,0,0,.35); margin-left: .5cqw; }
  .mode i.on { background: #ffe58a; }

  .row { display: flex; gap: 1cqw; margin-bottom: 1.2cqw; }
  .row:last-child { margin-bottom: 0; }
  .key {
    all: unset;
    box-sizing: border-box;
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    height: 5.4cqw;
    border-radius: 999px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    font-family: "Silkscreen", monospace;
    font-size: 1.5cqw;
    color: var(--key-ink);
    background: var(--c, var(--blue));
    box-shadow: 0 .8cqw 0 var(--cd, var(--blue-d)), 0 1.2cqw 1.2cqw rgba(0,0,0,.16), inset 0 .4cqw 0 rgba(255,255,255,.45), inset 0 -.6cqw .9cqw rgba(0,0,0,.12);
    transition: transform .06s, box-shadow .06s, filter .06s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .key:focus-visible { outline: .4cqw solid var(--ink); outline-offset: .4cqw; }
  .key.round { flex: 0 0 5.4cqw; width: 5.4cqw; }
  .key.down, .key:active { transform: translateY(.7cqw); box-shadow: 0 .1cqw 0 var(--cd, var(--blue-d)), inset 0 .3cqw 0 rgba(255,255,255,.2); filter: brightness(1.12); }
  .key small { font-size: .62em; margin-top: .3cqw; letter-spacing: .06em; opacity: .95; }
  .key.b { --c: var(--blue); --cd: var(--blue-d); }
  .key.r { --c: var(--red); --cd: var(--red-d); }
  .key.y { --c: var(--yellow); --cd: var(--yellow-d); color: var(--key-ink-dark); }
  .key.g { --c: var(--green); --cd: var(--green-d); color: var(--key-ink-dark); }
  .key.w { --c: var(--white); --cd: var(--white-d); color: var(--key-ink-dark); }
  .key.brick {
    --c: var(--red); --cd: var(--red-d);
    background-image:
      linear-gradient(rgba(0,0,0,.22) .35cqw, transparent .35cqw),
      linear-gradient(90deg, rgba(0,0,0,.22) .35cqw, transparent .35cqw);
    background-size: 100% 1.5cqw, 2.4cqw 100%;
    background-color: var(--red);
  }
  .key.sp { --c: var(--yellow); --cd: var(--yellow-d); color: var(--key-ink-dark); font-size: 1.7cqw; }
  .key.nav::after {
    content: ""; position: absolute; top: 1cqw; right: 1cqw; width: .9cqw; height: .9cqw; border-radius: 50%;
    background: #2342ff; box-shadow: 0 0 0 .2cqw #fff;
  }
  .key.nav.active { filter: brightness(1.15); transform: translateY(.4cqw); }
  .key.nav::after, .key.nav.active::after { display: none; }
  .key.nav.active::after { background: #ffe58a; box-shadow: 0 0 0 .2cqw #2342ff; }
  .hint { margin: 22px 0 0; text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .06em; line-height: 1.8; }

  @media (max-width: 680px) {
    body { padding: 16px 10px 28px; }
    .tv { padding: 10px; border-radius: 24px; }
    .stage { grid-template-columns: 1fr; gap: 10px; padding: 8px 14px 18px; }
    .char { flex-direction: row; justify-content: flex-start; gap: 12px; }
    .face { width: 110px; height: auto; }
    .char { justify-self: center; }
    .tag { text-align: left; }
    .bubble::before { display: none; }
    .tiles { grid-template-columns: 1fr; }
    .glass { min-height: 0; }
    .key { font-size: 1.7cqw; }
    .key small { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .caret, .lcd .cur, .face .dots rect, .steam, .arm, .dash { animation: none; }
    .tile:hover, .tile:focus-visible, .q:hover, .q:focus-visible { transform: none; }
  }

  /* ---------- desk scene ---------- */
  :root {
    --wall: #eef2fd; --desk: #b9c5f0; --desk-line: rgba(255,255,255,.6);
    --plastic: #ffffff; --plastic-shade: #f3d3e3; --outline: #2a3670;
    --sky1: #8d9bd6; --sky2: #41549a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --wall: #1b2147; --desk: #3a2350; --desk-line: #4b3367; --plastic: #f3e3ec; --plastic-shade: #c79bb5; }
  }
  :root[data-theme="dark"] { --wall: #1b2147; --desk: #3a2350; --desk-line: #4b3367; --plastic: #f3e3ec; --plastic-shade: #c79bb5; }

  body { display: block; padding: 0; background: var(--wall); background-image: none; }
  .scene { width: 100%; overflow-x: clip; }
  .wall { position: relative; z-index: 2; background: var(--wall); padding: 56px 16px 0; }
  .wall-in { position: relative; max-width: 1120px; margin: 0 auto; }
  .computer { position: relative; z-index: 3; max-width: 780px; margin: 0 auto; }

  .beads { position: absolute; top: -32px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; z-index: 4; }
  .beads span { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--outline); display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--outline); }
  .beads span:nth-child(1) { background: #ffd7e9; }
  .beads span:nth-child(2) { background: #c9d1f2; }
  .beads span:nth-child(3) { background: #fff; }
  .beads span:nth-child(4) { background: #8d9bd6; }
  .beads span:nth-child(5) { background: #ff9fc8; }

  .tv {
    position: relative;
    background: var(--plastic);
    border: 3px solid var(--outline);
    border-radius: 30px 30px 14px 14px;
    padding: 22px 22px 0;
    box-shadow: inset 0 -8px 0 var(--plastic-shade), 0 10px 0 rgba(42,54,112,.18);
  }
  .inner { background: #2a2f4d; border: 3px solid var(--outline); border-radius: 22px; padding: 14px; }
  .glass { border-radius: 14px / 16px; }
  .chin { position: relative; height: 104px; }
  .chin-dots { position: absolute; left: 26px; top: 20px; display: flex; gap: 10px; }
  .chin-dots svg { width: 30px; height: 30px; }
  .slot { position: absolute; right: 26px; top: 20px; width: 40%; height: 30px; border: 3px solid var(--outline); border-radius: 6px; background: var(--plastic-shade); }
  .slot i { position: absolute; left: 10px; right: 10px; top: 50%; height: 3px; margin-top: -2px; background: var(--outline); border-radius: 2px; }
  .stk { position: absolute; font-family: "Silkscreen", monospace; font-size: 12px; font-weight: 700; color: var(--outline); padding: 4px 9px; border: 2.5px solid var(--outline); }
  .stk1 { left: 24px; bottom: 16px; background: #ff9fc8; transform: rotate(-4deg); }
  .stk2 { left: 188px; bottom: 12px; background: #c9d1f2; transform: rotate(3deg); }

  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #c9d1f2; border-top: 3px solid #fff; font-family: "Silkscreen", monospace; font-size: 11px; color: var(--outline); }
  .taskbar .start { all: unset; cursor: pointer; padding: 3px 13px; background: #ffd7e9; border: 2px solid var(--outline); border-radius: 14px; }
  .taskbar .start:hover, .taskbar .start:focus-visible { background: #fff; outline: 2px solid var(--outline); outline-offset: 2px; }
  .taskbar .tab { padding: 3px 13px; background: #fff; border: 2px solid var(--outline); border-radius: 14px; }
  .taskbar .clock { margin-left: auto; }
  .stage { padding-bottom: 48px; }

  .boot { position: absolute; inset: 0; z-index: 6; background: var(--screen); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .45s; }
  .boot.hide { opacity: 0; pointer-events: none; }
  .boot-title { font-family: "Silkscreen", monospace; font-weight: 700; font-size: clamp(24px, 5vw, 44px); color: var(--face); letter-spacing: .08em; text-shadow: 3px 3px 0 #2a3670; }
  .boot-bar { display: flex; gap: 3px; padding: 4px; border: 3px solid #fff; background: #c9d1f2; }
  .boot-bar i { width: 16px; height: 18px; background: transparent; }
  .boot-bar i.on { background: #41549a; }
  .boot-sub { font-family: "Silkscreen", monospace; font-size: 13px; color: var(--text); letter-spacing: .15em; }

  .desk { position: relative; z-index: 1; margin-top: -42px; padding: 76px 16px 48px; background-color: var(--desk); border-top: 4px solid var(--outline); overflow: hidden; }
  .desk::before { content: ""; position: absolute; left: -60%; right: -60%; top: 0; height: 720px; background-image: linear-gradient(var(--desk-line) 3px, transparent 3px), linear-gradient(90deg, var(--desk-line) 3px, transparent 3px); background-size: 64px 64px; background-position: 50% 0; transform-origin: 50% 0; transform: perspective(900px) rotateX(58deg); pointer-events: none; }
  .desk-in { position: relative; z-index: 1; }
  .desk-in { max-width: 820px; margin: 0 auto; }
  .kb-wrap { margin-top: 0; }
  .kb { border: 3px solid var(--outline); }
  .kb-wrap { position: relative; perspective: 1400px; margin-top: -48px; }
  .kb { position: relative; z-index: 1; transform: rotateX(30deg); transform-origin: 50% 100%; }
  .kb-wrap::before { content: ""; position: absolute; left: 5%; right: 5%; bottom: -12px; height: 34px; background: rgba(42,54,112,.3); filter: blur(12px); border-radius: 50%; }
  .hint { color: var(--outline); }

    var t = TOPICS[id];
    say(t.a, function () {
      var extra = (t.link ? projLink(t.link) : '') + (t.follow ? chipsHtml(t.follow) : '');
      if (extra) addMsg('bear', extra, true);
    });
  }

  // ---------- keyword matching ----------
  function norm(s) { return ' ' + s.toLowerCase().replace(/[^a-z0-9é\s'-]/g, ' ').replace(/\s+/g, ' ').trim() + ' '; }
  function bestTopic(q) {
    var text = norm(q), best = null, bestScore = 0;
    Object.keys(TOPICS).forEach(function (id) {
      if (id === 'background-pick' || !TOPICS[id].a) return;
      var score = 0;
      TOPICS[id].keys.forEach(function (k) {
        var key = ' ' + k.toLowerCase() + ' ';
        // whole-word match; longer phrases count more
        if (text.indexOf(key) !== -1) score += 1 + (k.split(' ').length - 1) * 2;
        else if (k.length > 4 && k.indexOf(' ') === -1 && text.indexOf(' ' + k.toLowerCase()) !== -1) score += 0.5; // prefix: "designing" ~ "design"
      });
      if (score > bestScore) { bestScore = score; best = id; }
    });
    return bestScore >= 1 ? best : null;
  }
  var fallbackN = 0;
  function reply(q) {
    var id = bestTopic(q);
    if (id) return answerTopic(id);
    var line = FALLBACK_LINES[fallbackN++ % FALLBACK_LINES.length];
    say(line, function () { addMsg('bear', chipsHtml(FALLBACK_FOLLOW), true); });
  }
  // tapping a follow-up chip
  threadEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.q[data-topic]') : null;
    if (!b) return;
    wake();
    var id = b.dataset.topic;
    addMsg('me', TOPICS[id].label);
    answerTopic(id);
  });

  function onKey(k, how) {
    wake();
    if (how === 'click') press(k.id, 120);
    if (k.id === 'enter') {
      if (buf.trim()) { var q = buf.trim(); buf = ''; renderLcd(); enterChat(); addMsg('me', q); reply(q); } else { navTo('talk'); }
      return;
    }
    if (how === 'click' && k.nav) { navTo(k.nav); return; }
    if (k.id === 'back') { buf = buf.slice(0, -1); renderLcd(); return; }
    var ch = k.id === 'space' ? ' ' : (k.id.length === 1 ? k.id : '');
    if (ch) { buf += ch; renderLcd(); thinking(); }
  }

  function thinking() {
    clearInterval(speaking);
    if (!chat && viewKey === 'work') { clearTimeout(revealT); setViewShown(true); scheduleRotate(); }
    setFace('think');
    clearTimeout(thinkT);
    thinkT = setTimeout(function () { setFace('idle'); scheduleIdle(); }, 1100);
  }
  function wake() { clearTimeout(idleT); }
  function scheduleIdle() {
    clearTimeout(idleT);
    idleT = setTimeout(function () { if (!chat) say(IDLE[Math.floor(Math.random() * IDLE.length)]); }, 16000);
  }
  function press(id, ms) {
    var el = keyEls[id]; if (!el) return;
    el.classList.add('down');
    if (ms) setTimeout(function () { el.classList.remove('down'); }, ms);
  }

  // ---------- real keyboard mirroring ----------
  var CODES = { Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', BracketLeft: '[', BracketRight: ']', Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`',
    Space: 'space', Enter: 'enter', Backspace: 'back', Tab: 'tab', CapsLock: 'caps', ShiftLeft: 'shiftl', ShiftRight: 'shiftr', ControlLeft: 'ctrll', ControlRight: 'ctrlr',
    AltLeft: 'altl', AltRight: 'altr', MetaLeft: 'win', MetaRight: 'win' };
  function idFor(e) {
    if (/^Key[A-Z]$/.test(e.code)) return e.code[3].toLowerCase();
    if (/^Digit[0-9]$/.test(e.code)) return e.code[5];
    return CODES[e.code] || null;
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    var id = idFor(e); if (!id) return;
    var tag = (document.activeElement || {}).tagName;
    if (e.key === ' ' || e.key === 'Enter') { if (tag === 'BUTTON') return; e.preventDefault(); }
    if (e.key === 'Backspace' || e.key === 'Tab') { if (e.key === 'Tab') { press(id, 120); return; } }
    press(id);
    if (e.repeat && id.length > 1 && id !== 'back' && id !== 'space') return;
    var def = null; ROWS.forEach(function (r) { r.forEach(function (k) { if (k.id === id) def = k; }); });
    if (def) onKey(def, 'key');
  });
  document.addEventListener('keyup', function (e) {
    var id = idFor(e); if (id && keyEls[id]) keyEls[id].classList.remove('down');
  });

  // blink
  setInterval(function () {
    if (face.dataset.s !== 'idle') return;
    face.dataset.b = '1';
    setTimeout(function () { face.dataset.b = '0'; }, 140);
  }, 3400);

  renderLcd();
  showView('work', true);

  // boot screen, taskbar clock and start button
  var bootEl = document.getElementById('boot'), bootBars = bootEl.querySelectorAll('.boot-bar i');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bootStep = 0;
  var bootTimer = setInterval(function () {
    if (bootStep < bootBars.length) { bootBars[bootStep++].classList.add('on'); return; }
    clearInterval(bootTimer);
    bootEl.classList.add('hide');
    setTimeout(function () { bootEl.style.display = 'none'; say(VIEWS.work.line, revealPromptsSoon); scheduleIdle(); }, reduceMotion ? 0 : 450);
  }, reduceMotion ? 15 : 130);
  var clockEl = document.getElementById('clock');
  function tick() { var d = new Date(); clockEl.textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM'); }
  tick(); setInterval(tick, 30000);

  // Scale the scene as if the screen were BASE_GLASS tall so the computer keeps its size, then let the
  // frame grow by however much taller the screen is (the parent page resizes the iframe to match).
  var sceneEl = document.querySelector('.scene');
  function fitScene() {
    var vw = window.innerWidth, vh = window.innerHeight;
    try { if (window.parent !== window) vh = window.parent.innerHeight; } catch (e) {}
    var BASE_GLASS = 560, BASE_DESK = 400;
    function reportHeight(px) { try { if (window.parent !== window) window.parent.postMessage({ type: 'mocha-frame-height', height: px }, location.origin); } catch (e) {} }
    if (vw < 900) { sceneEl.style.transform = ''; sceneEl.style.left = ''; sceneEl.style.top = ''; sceneEl.style.removeProperty('--desk-gap'); sceneEl.style.removeProperty('--kb-lift'); sceneEl.style.removeProperty('--vis-w'); sceneEl.style.removeProperty('--side-fade'); document.body.style.background = ''; reportHeight(0); return; }
    var TOP_GAP = 112, BOTTOM_GAP = 80, KB_DROP = 36;
    sceneEl.style.transform = 'none';
    sceneEl.style.top = TOP_GAP + 'px';
    sceneEl.style.setProperty('--desk-gap', '0px');
    var h = sceneEl.offsetHeight, extra = Math.max(0, document.getElementById('glass').offsetHeight - BASE_GLASS) + Math.max(0, document.querySelector('.desk').offsetHeight - BASE_DESK);
    var sc = Math.min(vw / 1500, (vh - TOP_GAP - BOTTOM_GAP - KB_DROP) / (h - extra));
    // extend the desk below the keyboard so there are BOTTOM_GAP real px before the footer
    // the keyboard lies on the tilted table plane, so lift it along the plane (foreshortened by the tilt) to leave BOTTOM_GAP below it
    sceneEl.style.setProperty('--desk-gap', ((BOTTOM_GAP + KB_DROP) / sc) + 'px');
    sceneEl.style.setProperty('--vis-w', (vw / sc) + 'px');
    sceneEl.style.setProperty('--side-fade', Math.max(0, (vw / sc - 1700) / 2) + 'px');
    sceneEl.style.setProperty('--kb-lift', (BOTTOM_GAP * 1.1 / sc) + 'px');
    sceneEl.style.transform = 'scale(' + sc + ')';
    sceneEl.style.left = Math.max(0, (vw - 1500 * sc) / 2) + 'px';
    reportHeight(Math.ceil(TOP_GAP + sceneEl.offsetHeight * sc));
    var y = document.querySelector('.desk').getBoundingClientRect().top;
    document.body.style.background = 'linear-gradient(var(--wall) 0, var(--wall) ' + y + 'px, var(--outline) ' + y + 'px, var(--outline) ' + (y + 4 * sc) + 'px, var(--desk) ' + (y + 4 * sc) + 'px, var(--desk) 100%)';
  }
  fitScene();
  window.addEventListener('resize', fitScene);
  window.addEventListener('load', fitScene);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitScene);
  document.getElementById('start').addEventListener('click', resetChat);
  document.querySelectorAll('.icon').forEach(function (b) { b.addEventListener('click', function () { wake(); navTo(b.dataset.nav); }); });
})();
</script>
</body>
</html>
